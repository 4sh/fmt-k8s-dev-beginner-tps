apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 4sh-formation-@ME
resources:
  - ../../base
configMapGenerator:
  - name: env-config
    envs:
      - env.conf
  - name: app-config
    files:
      - app.conf
images:
  - name: europe-west9-docker.pkg.dev/qsh-learning/qsh-learning-docker-registry/myapp-ui-me
    newName: europe-west9-docker.pkg.dev/qsh-learning/qsh-learning-docker-registry/myapp-ui-@ME:1.0
  - name: europe-west9-docker.pkg.dev/qsh-learning/qsh-learning-docker-registry/myapp-srv-me
    newName: europe-west9-docker.pkg.dev/qsh-learning/qsh-learning-docker-registry/myapp-srv-@ME:2.0.0